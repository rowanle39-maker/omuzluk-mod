name: Build Omuzluk Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14 (ForgeGradle 2.3 uyumlu)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '2.14'

      - name: Build with Gradle
        run: gradle build --stacktrace --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: omuzluk-mod-jar
          path: build/libs/*.jar
